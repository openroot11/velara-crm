<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>Velara CRM</title>
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
<link rel="apple-touch-icon" href="/img/icon-1080.png" />
<!-- Manifest + service worker: permiten "Instalar Velara CRM" desde el menu
     de Brave/Chrome (icono propio, ventana sin barra de navegador, anclable
     a la barra de tareas) en vez de un simple acceso directo a la pestaña. -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0B0B0B" />
<!-- Aplica el tema ANTES de pintar nada (localStorage -> preferencia del
     sistema -> claro) para no mostrar un parpadeo del tema equivocado.
     El resto de la lógica del interruptor vive en public/js/theme.js. -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('nova_theme'); } catch (e) {}
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark');
  })();
</script>
<style id="theme-vars">
  /* Paleta del manual de marca VELARA (Velara/VELARA_IDENTIDAD_VISUAL/
     06_MANUAL_DE_MARCA, sección 03): negro carbón #0B0B0B, grafito
     #252525, blanco roto #F2F0EA, plata metálico #A7A9AC y un solo acento,
     el rojo deportivo #D71920. Regla del sitio: el rojo es acento (botón
     principal, filetes, el total), nunca el color dominante.
     Modo claro (por defecto). Los tokens "fixed" de Material 3 no viven
     aquí -- por definición no cambian entre claro/oscuro (ver tailwind-config). */
  /* Estética "Shakuro CRM": la app es una ventana blanca de esquinas
     suaves apoyada sobre un fondo gris claro (--c-shell), con el menú
     lateral sobre ese mismo gris, bordes de 1px casi invisibles, texto de
     13px y botones principales en negro. El rojo de marca queda como
     acento puntual (--c-accent), no como color de botón. */
  :root {
    --c-backdrop: #E6E6EB;
    --c-shell: #F7F7F8;
    --c-accent: #D71920;
    --c-surface: #ffffff;
    --c-surface-container-lowest: #ffffff;
    --c-surface-container-low: #F7F7F8;
    --c-surface-container: #F3F3F4;
    --c-surface-container-high: #ECECEE;
    --c-surface-container-highest: #E4E4E7;
    --c-surface-variant: #ECECEE;
    --c-surface-dim: #ECECEE;
    --c-surface-bright: #ffffff;
    --c-background: #ffffff;
    --c-on-surface: #18181B;
    --c-on-surface-variant: #6B6B73;
    --c-on-background: #18181B;
    --c-outline: #A1A1AA;
    --c-outline-variant: #EBEBED;
    --c-inverse-surface: #18181B;
    --c-inverse-on-surface: #FAFAFA;

    --c-primary: #18181B;
    --c-on-primary: #ffffff;
    --c-primary-container: #F3F3F4;
    --c-on-primary-container: #18181B;
    --c-inverse-primary: #FAFAFA;
    --c-surface-tint: #18181B;
    --c-primary-hover: #000000;
    /* Relleno de checkbox/radio marcados: neutro (el rojo es solo para
       logo, boton principal y filetes). */
    --c-check: #0B0B0B;

    --c-secondary: #2a78d6;
    --c-on-secondary: #ffffff;
    --c-secondary-container: #dbe9fb;
    --c-on-secondary-container: #0b3d78;

    --c-tertiary: #A6710A;
    --c-on-tertiary: #ffffff;
    --c-tertiary-container: #F5E1B8;
    --c-on-tertiary-container: #4A3400;

    /* Error en carmesí, un paso más oscuro que el rojo de marca para que una
       alerta no se confunda con el botón principal. */
    --c-error: #B42318;
    --c-on-error: #ffffff;
    --c-error-container: #FDE4E1;
    --c-on-error-container: #7A1410;

    --c-status-good: #1F9D55;
    --c-status-warning: #E0A100;
    --c-status-serious: #B8791A;
    --c-status-critical: #B42318;

    /* Sombras de "ventana": muy difusas, nunca un fondo oscuro detrás. */
    --shadow-app: 0 30px 60px -20px rgba(16, 16, 30, 0.18), 0 2px 6px rgba(16, 16, 30, 0.05);
    --shadow-window: 0 1px 2px rgba(16, 16, 20, 0.04), 0 8px 24px -6px rgba(16, 16, 20, 0.06);
    --shadow-pop: 0 0 0 1px rgba(16, 16, 20, 0.06), 0 12px 32px -4px rgba(16, 16, 20, 0.14), 0 2px 6px rgba(16, 16, 20, 0.05);
  }

  /* Modo oscuro: superficies en negro carbón y grafito, texto en blanco
     roto, plata para lo secundario. El rojo se mantiene rojo (el manual
     pide que la pieza roja no cambie) con un tono apenas más vivo para que
     se lea sobre negro. */
  :root.dark,
  .theme-ink {
    --c-backdrop: #050506;
    --c-shell: #111113;
    --c-accent: #E3212A;
    --c-surface: #161618;
    --c-surface-container-lowest: #161618;
    --c-surface-container-low: #1C1C1F;
    --c-surface-container: #212124;
    --c-surface-container-high: #28282C;
    --c-surface-container-highest: #313136;
    --c-surface-variant: #313136;
    --c-surface-dim: #0C0C0E;
    --c-surface-bright: #3A3A3F;
    --c-background: #161618;
    --c-on-surface: #F4F4F5;
    --c-on-surface-variant: #A1A1AA;
    --c-on-background: #F4F4F5;
    --c-outline: #71717A;
    --c-outline-variant: #2A2A2E;
    --c-inverse-surface: #F4F4F5;
    --c-inverse-on-surface: #18181B;

    --c-primary: #F4F4F5;
    --c-on-primary: #18181B;
    --c-primary-container: #28282C;
    --c-on-primary-container: #F4F4F5;
    --c-inverse-primary: #18181B;
    --c-surface-tint: #F4F4F5;
    --c-primary-hover: #ffffff;
    --shadow-window: 0 0 0 1px rgba(255, 255, 255, 0.04);
    --shadow-app: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
    --shadow-pop: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 16px 40px -4px rgba(0, 0, 0, 0.6);
    --c-check: #A7A9AC;

    --c-secondary: #8AC0F5;
    --c-on-secondary: #062347;
    --c-secondary-container: #14509a;
    --c-on-secondary-container: #dbe9fb;

    --c-tertiary: #D9A94A;
    --c-on-tertiary: #2E1F00;
    --c-tertiary-container: #6B4D00;
    --c-on-tertiary-container: #F5E1B8;

    --c-error: #FF8A80;
    --c-on-error: #3B0A06;
    --c-error-container: #7A1410;
    --c-on-error-container: #FFDAD6;

    --c-status-good: #22C55E;
    --c-status-warning: #FFC94D;
    --c-status-serious: #E0A83D;
    --c-status-critical: #FF6E6E;
  }

  /* El menú lateral vive sobre el gris del fondo (no es una barra negra):
     sus estados hover/activo usan grises un paso más oscuros que ese fondo. */
  #sidebar {
    --c-surface-container-low: #EEEEF0;
    --c-surface-container-high: #E8E8EB;
  }
  :root.dark #sidebar {
    --c-surface-container-low: #1A1A1D;
    --c-surface-container-high: #222226;
  }
</style>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Inter: tipografía secundaria del manual de marca VELARA (títulos, textos
     e interfaz). La de "VELARA" es propia del logo y nunca se escribe. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-sankey@0.14.0/dist/chartjs-chart-sankey.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          // Paleta de marca VELARA Taller S.A.S. (manual de marca, ver
          // #theme-vars). Todos los tokens que deben verse distinto en modo
          // oscuro apuntan a una variable CSS (definida mas abajo en
          // #theme-vars, :root vs .dark) en vez de un hex fijo -- asi el
          // interruptor de tema (ver public/js/theme.js) no necesita tocar
          // ninguna vista: cada `bg-surface`/`text-on-surface`/etc ya
          // resuelve solo al color correcto. Los tokens "fixed" de Material
          // 3 (primary-fixed, secondary-fixed, tertiary-fixed y sus
          // variantes on-*) quedan en hex fijo a proposito -- por definicion
          // no cambian entre claro/oscuro.
          'surface-container-low': 'var(--c-surface-container-low)',
          'on-secondary-container': 'var(--c-on-secondary-container)',
          'surface-container-high': 'var(--c-surface-container-high)',
          'on-primary-container': 'var(--c-on-primary-container)',
          outline: 'var(--c-outline)',
          'error-container': 'var(--c-error-container)',
          error: 'var(--c-error)',
          'primary-fixed': '#FBE3E4',
          'on-primary': 'var(--c-on-primary)',
          'tertiary-fixed': '#F5E1B8',
          'surface-container-lowest': 'var(--c-surface-container-lowest)',
          'tertiary-fixed-dim': '#D9A94A',
          'surface-tint': 'var(--c-surface-tint)',
          'on-error': 'var(--c-on-error)',
          'on-surface': 'var(--c-on-surface)',
          'on-tertiary-fixed': '#2E1F00',
          'secondary-fixed-dim': '#9dc4f2',
          'inverse-surface': 'var(--c-inverse-surface)',
          'on-tertiary-fixed-variant': '#6B4D00',
          'on-secondary-fixed': '#062347',
          'on-primary-fixed-variant': '#7F0E12',
          'on-secondary': 'var(--c-on-secondary)',
          'secondary-fixed': '#dbe9fb',
          surface: 'var(--c-surface)',
          'tertiary-container': 'var(--c-tertiary-container)',
          'on-error-container': 'var(--c-on-error-container)',
          'on-surface-variant': 'var(--c-on-surface-variant)',
          tertiary: 'var(--c-tertiary)',
          'on-tertiary': 'var(--c-on-tertiary)',
          'surface-dim': 'var(--c-surface-dim)',
          'surface-bright': 'var(--c-surface-bright)',
          secondary: 'var(--c-secondary)',
          'on-tertiary-container': 'var(--c-on-tertiary-container)',
          'on-secondary-fixed-variant': '#14509a',
          'surface-variant': 'var(--c-surface-variant)',
          'on-background': 'var(--c-on-background)',
          'inverse-primary': 'var(--c-inverse-primary)',
          'secondary-container': 'var(--c-secondary-container)',
          'primary-container': 'var(--c-primary-container)',
          'outline-variant': 'var(--c-outline-variant)',
          'inverse-on-surface': 'var(--c-inverse-on-surface)',
          'primary-fixed-dim': '#F0565B',
          background: 'var(--c-background)',
          'surface-container-highest': 'var(--c-surface-container-highest)',
          primary: 'var(--c-primary)',
          'primary-hover': 'var(--c-primary-hover)',
          'surface-container': 'var(--c-surface-container)',
          'on-primary-fixed': '#3D0507',
          // Escala de estado fija (buena/advertencia/grave/critica) para
          // badges de SLA, acciones prioritarias y tablero Kanban -- no se
          // usa para series de graficas (esas usan la paleta categorica ya
          // validada, ver components/colombiaMap.js PRODUCT_COLORS).
          shell: 'var(--c-shell)',
          backdrop: 'var(--c-backdrop)',
          accent: 'var(--c-accent)',
          'status-good': 'var(--c-status-good)',
          'status-warning': 'var(--c-status-warning)',
          'status-serious': 'var(--c-status-serious)',
          'status-critical': 'var(--c-status-critical)',
        },
        // Esquinas suaves y consistentes: campos y botones 8px, tarjetas
        // 12px, ventana principal y paneles 16px.
        borderRadius: {
          sm: '4px',
          DEFAULT: '6px',
          md: '8px',
          lg: '8px',
          xl: '12px',
          '2xl': '16px',
          full: '9999px',
        },
        spacing: {
          'margin-desktop': '24px',
          gutter: '16px',
          'table-cell-padding': '8px 12px',
          base: '4px',
          'margin-mobile': '16px',
        },
        fontFamily: {
          // Inter en todo, como pide el manual de marca (títulos, textos e
          // interfaz). Se conservan los nombres de token que ya usan las
          // vistas (~200 sitios) para no tocarlas.
          'headline-lg': ['Inter', 'system-ui', 'sans-serif'],
          'headline-md': ['Inter', 'system-ui', 'sans-serif'],
          'headline-sm': ['Inter', 'system-ui', 'sans-serif'],
          'body-sm': ['Inter', 'system-ui', 'sans-serif'],
          'label-bold': ['Inter', 'system-ui', 'sans-serif'],
          'body-md': ['Inter', 'system-ui', 'sans-serif'],
          'display-kpi': ['Inter', 'system-ui', 'sans-serif'],
          label: ['Inter', 'system-ui', 'sans-serif'],
          caption: ['Inter', 'system-ui', 'sans-serif'],
        },
        fontSize: {
          // Escala compacta tipo Shakuro: interfaz en 13px, títulos en
          // peso 600 (no negrita pesada) y cifras grandes con tracking
          // negativo.
          'headline-lg': ['26px', { lineHeight: '34px', letterSpacing: '-0.025em', fontWeight: '600' }],
          'headline-md': ['21px', { lineHeight: '28px', letterSpacing: '-0.02em', fontWeight: '600' }],
          'headline-sm': ['16px', { lineHeight: '24px', letterSpacing: '-0.01em', fontWeight: '600' }],
          'body-sm': ['12.5px', { lineHeight: '18px', fontWeight: '400' }],
          'label-bold': ['11px', { lineHeight: '14px', letterSpacing: '0.03em', fontWeight: '600' }],
          'body-md': ['13.5px', { lineHeight: '20px', fontWeight: '400' }],
          'display-kpi': ['36px', { lineHeight: '42px', letterSpacing: '-0.03em', fontWeight: '500' }],
          // "label" = misma metrica que label-bold (mismo uso: eyebrows y
          // encabezados de columna en mayuscula) pero peso medio en vez de
          // negrita, para cuando la negrita compite demasiado con el resto.
          label: ['11px', { lineHeight: '12px', letterSpacing: '0.05em', fontWeight: '500' }],
          // "caption" = texto secundario/pie de dato mas chico que body-sm.
          // Reemplaza los `text-[10px]`/`text-[11px]` sueltos que hoy estan
          // escritos a mano en varias vistas (timestamps, notas al pie de
          // tabla) por un token real.
          caption: ['11px', { lineHeight: '14px', fontWeight: '400' }],
        },
      },
    },
  };
</script>
<!--
  Componente Boton (Fase 4). Procesado por el motor JIT de Tailwind (Play
  CDN) igual que el resto de la app -- no es una libreria nueva, son clases
  que resuelven a los mismos tokens M3 de arriba via @apply. 5 variantes
  (primary/secondary/ghost/destructive/icon) x 6 estados (default/hover/
  active/focus/disabled/loading), para reemplazar los 20+ strings de clase
  que hoy se repetian sueltos en cada vista.

  Uso: <button class="btn btn-primary">Guardar</button>
       <button class="btn btn-secondary" disabled>...</button>
       <button class="btn btn-icon" aria-label="Cerrar"><span class="material-symbols-outlined">close</span></button>
       <button class="btn btn-primary" data-loading>...</button>  -- data-loading = estado "loading"
-->
<style type="text/tailwindcss">
  /* Base: el plugin "forms" de Tailwind pinta todos los campos con fondo
     blanco fijo y anillo de foco azul. En modo oscuro eso dejaba texto casi
     blanco sobre fondo blanco (ilegible) en los campos que no traian su
     propia clase de fondo. Aqui se reemplaza por los tokens del tema, y
     color-scheme hace que calendarios, selects y barras nativas del
     navegador tambien se vean oscuros. Las clases utilitarias de cada vista
     (bg-*, border-*, focus:*) siguen ganando porque van en otra capa. */
  @layer base {
    :root { color-scheme: light; }
    :root.dark { color-scheme: dark; }
    [type='text'], input:where(:not([type])), [type='email'], [type='url'], [type='password'],
    [type='number'], [type='date'], [type='datetime-local'], [type='month'], [type='search'],
    [type='tel'], [type='time'], [type='week'], [multiple], textarea, select {
      background-color: var(--c-surface-container-lowest);
      color: var(--c-on-surface);
      border-color: var(--c-outline-variant);
      /* Misma escala que la interfaz (el plugin los deja en 16px). */
      font-size: 13.5px;
      line-height: 20px;
      border-radius: 8px;
    }
    [type='text']:focus, input:where(:not([type])):focus, [type='email']:focus, [type='url']:focus,
    [type='password']:focus, [type='number']:focus, [type='date']:focus, [type='datetime-local']:focus,
    [type='month']:focus, [type='search']:focus, [type='tel']:focus, [type='time']:focus,
    [type='week']:focus, [multiple]:focus, textarea:focus, select:focus {
      --tw-ring-color: color-mix(in srgb, var(--c-outline) 35%, transparent);
      border-color: var(--c-outline);
    }
    ::placeholder { color: var(--c-outline); opacity: 1; }
    /* Las vistas ponen p-2/p-2.5 en los select y eso pisa el espacio de la
       flecha: el texto largo quedaba encima de ella. */
    select { padding-right: 2.25rem !important; }
    [type='checkbox'], [type='radio'] {
      color: var(--c-check);
      border-color: var(--c-outline);
      background-color: var(--c-surface-container-lowest);
    }
    [type='checkbox']:focus, [type='radio']:focus { --tw-ring-color: var(--c-outline); }
    /* Foco visible para teclado en enlaces y botones que no traen el suyo
       (los .btn ya tienen su anillo). :where() = especificidad cero, asi
       cualquier clase de la vista lo puede sobrescribir. */
    :where(a, button, summary, [role='tab'], [tabindex]):focus-visible {
      outline: 2px solid var(--c-outline);
      outline-offset: 2px;
    }
  }

  /* Telefono: titulos y cifras grandes un paso mas chicos para que quepan
     sin desbordar (el tamaño de escritorio no cambia). */
  @media (max-width: 639px) {
    #view-root .text-headline-lg { font-size: 24px; line-height: 32px; }
    #view-root .text-display-kpi { font-size: 36px; line-height: 42px; }
  }

  @layer components {
    /* Gesto firma de la marca: filete rojo corto bajo un título. */
    .rule-under { display: block; width: 2rem; height: 2px; background: var(--c-accent); }
    /* Rótulo de sección: chico, gris, sin gritar (como "Work" / "Team"). */
    .eyebrow { font-size: 11.5px; line-height: 1; font-weight: 500; letter-spacing: 0.01em; color: var(--c-outline); }

    .btn {
      @apply relative inline-flex items-center justify-center gap-1.5 rounded-lg px-3 h-8
             text-[13px] leading-[16px] font-medium whitespace-nowrap select-none
             transition-colors duration-150 ease-out
             disabled:opacity-45 disabled:cursor-not-allowed disabled:pointer-events-none
             focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline focus-visible:ring-offset-1 focus-visible:ring-offset-surface;
    }
    .btn .material-symbols-outlined { @apply text-[17px]; }

    /* Primary: accion principal de la pantalla/formulario -- una sola por vista. Negro, como "New Contact". */
    .btn-primary {
      @apply bg-primary text-on-primary
             hover:bg-primary-hover active:brightness-90;
    }
    /* Secondary: accion alterna, no destructiva -- mismo patron "tonal
       outline" que ya usaban SLA/Seguimiento a mano (bg-surface-container-
       lowest + border + hover primary/10), ahora formalizado. */
    .btn-secondary {
      @apply bg-surface text-on-surface border border-outline-variant shadow-[0_1px_1px_rgba(16,16,20,0.04)]
             hover:bg-surface-container-low active:bg-surface-container-high;
    }
    /* Tertiary/Ghost: accion de bajo enfasis (cancelar, ver mas) -- sin relleno ni borde. */
    .btn-ghost {
      @apply bg-transparent text-on-surface-variant
             hover:bg-surface-container-low hover:text-on-surface active:bg-surface-container-high;
    }
    /* Destructive: borra/revierte algo -- rojo, solo para esa accion. */
    .btn-destructive {
      @apply bg-error text-on-error
             hover:bg-error/90 active:brightness-90;
    }
    /* Icon button: solo icono, sin texto -- SIEMPRE con aria-label (el icono
       solo no es un nombre accesible). Cuadrado suave, mismo hover que el
       resto de iconos de topbar/sidebar. */
    .btn-icon {
      @apply w-8 px-0 rounded-lg bg-transparent text-on-surface-variant
             hover:bg-surface-container hover:text-on-surface active:bg-surface-container-high;
    }
    .btn-icon .material-symbols-outlined { @apply text-[19px]; }

    /* Loading: se activa con el atributo data-loading (no una clase, para
       poder alternarlo con dataset.loading = '' / delete sin tocar
       className). Oculta el contenido -- texto suelto o envuelto en <span>,
       icono, lo que sea -- via color:transparent (no visibility, que no
       alcanza un nodo de texto plano) sin colapsar el ancho del boton, y
       muestra un spinner centrado. El color del spinner se fija aparte por
       variante porque no puede heredar del boton (que ahora es transparente).*/
    .btn[data-loading] {
      color: transparent !important;
      @apply pointer-events-none;
    }
    .btn[data-loading]::after {
      content: '';
      @apply absolute w-4 h-4 rounded-full border-2 border-t-transparent;
    }
    .btn-primary[data-loading]::after,
    .btn-destructive[data-loading]::after {
      @apply border-on-primary;
    }
    .btn-secondary[data-loading]::after,
    .btn-ghost[data-loading]::after,
    .btn-icon[data-loading]::after {
      @apply border-outline;
    }
    @media (prefers-reduced-motion: no-preference) {
      .btn[data-loading]::after { animation: btn-spin 0.6s linear infinite; }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn[data-loading]::after { @apply opacity-60; }
    }
    @keyframes btn-spin {
      to { transform: rotate(360deg); }

<body class="bg-backdrop font-body-md text-on-background h-screen overflow-hidden antialiased lg:p-3">

<!-- Una sola ventana, como la referencia (Shakuro CRM): menú lateral y
     contenido son la misma pieza, con esquinas suaves y sombra difusa sobre
     un fondo gris. El menú usa el gris claro de la ventana; el contenido es
     un panel blanco metido dentro con su propio borde. Solo el panel hace
     scroll -- el menú queda quieto. -->
<div id="app-window" class="relative flex h-full bg-shell lg:rounded-[18px] lg:border lg:border-outline-variant lg:shadow-[var(--shadow-app)] overflow-hidden">

  <nav id="sidebar" aria-label="Menú principal" class="fixed lg:static inset-y-0 left-0 w-[232px] max-w-[85vw] shrink-0 bg-shell flex flex-col z-40 transition-transform duration-200 ease-in-out lg:translate-x-0">
    <div class="px-5 pt-5 pb-4">
      <!-- Logo oficial VELARA. El manual pide mínimo 120 px de ancho. -->
      <a href="#/inicio" class="block" aria-label="Velara, ir a Inicio">
        <img src="/img/brand/logo-positivo.svg" alt="Velara" class="w-[120px] h-auto dark:hidden" />
        <img src="/img/brand/logo-negativo.svg" alt="Velara" class="w-[120px] h-auto hidden dark:block" />
      </a>
    </div>
    <ul id="nav-list" class="flex-1 overflow-y-auto pb-2 px-3 space-y-px">
      <!-- Lo llena app.js desde NAV (apps.js): todo junto, por grupos. -->
    </ul>
    <div id="sidebar-foot" class="px-4 py-4 flex items-center gap-2.5"></div>
  </nav>

  <!-- Fondo muy tenue detrás del menú cuando se abre en teléfono/tablet (app.js). -->
  <div id="sidebar-backdrop" class="fixed inset-0 z-[35] bg-black/10 hidden" aria-hidden="true"></div>

  <div id="main-col" class="flex-1 min-w-0 flex flex-col bg-surface lg:my-1.5 lg:mr-1.5 lg:rounded-xl lg:border lg:border-outline-variant overflow-hidden">
    <header id="topbar" class="flex justify-between items-center gap-2 w-full h-12 px-margin-mobile sm:px-6 shrink-0 bg-surface border-b border-outline-variant">
      <div class="flex items-center gap-2 min-w-0">
        <button id="sidebar-toggle-btn" type="button" aria-label="Mostrar u ocultar el menú" aria-controls="sidebar" class="btn btn-icon -ml-2 shrink-0" title="Mostrar/ocultar menú">
          <span class="material-symbols-outlined">dock_to_right</span>
        </button>
        <h2 id="page-title" class="text-[13.5px] font-medium text-on-surface truncate min-w-0">Velara CRM</h2>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button id="theme-toggle-btn" type="button" aria-label="Cambiar tema claro/oscuro" class="btn btn-icon" title="Cambiar a tema oscuro/claro">
          <span id="theme-toggle-icon" class="material-symbols-outlined">dark_mode</span>
        </button>
        <span id="conn-dot" class="w-1.5 h-1.5 rounded-full bg-outline-variant ml-1" title="Conectando…"></span>
      </div>
    </header>
    <main id="view-root" class="flex-1 min-w-0 overflow-y-auto p-margin-mobile sm:p-margin-desktop"></main>
  </div>
</div>

<div id="toast-root" class="fixed bottom-4 right-4 left-4 sm:left-auto z-[100] flex flex-col items-end gap-2" role="status" aria-live="polite"></div>
